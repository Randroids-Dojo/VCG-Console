# VCG Console RetroArch base configuration for the Raspberry Pi 5 appliance.
#
# vcg-host passes this file as --config and layers a generated vcg-session.cfg
# over it with --appendconfig; every key that layer sets wins. Storage paths,
# kiosk and menu-entry policy, and the I-132 no-enhancement baseline (shaders,
# run-ahead, preemptive frames, rewind, frame delay, automatic frame delay,
# hard GPU sync, threaded video) are set there, in
# native/vcg-host/src/retroarch.rs, and are not repeated here.
#
# The signed installed catalog binds this file by SHA-256. Editing it requires
# a new catalog and signature.

# scripts/pi/build-retro-frontend.sh configures RetroArch 1.22.2 with
# --disable-vulkan, so "gl" is the only accelerated video driver in the
# appliance build. Pinned so a build that later adds Vulkan cannot change the
# renderer without a catalog change.
video_driver = "gl"

# The session runs inside Cage, which owns the output mode. Present at the
# compositor's size instead of requesting a fullscreen mode.
video_windowed_fullscreen = "true"

# The frame pacing that the no-enhancement baseline in
# docs/RETRO_DISPLAY_LATENCY_ACCESSIBILITY_POLICY.md is measured against. The
# session layer disables every other latency feature but not this one.
video_vsync = "true"

# That policy also records black-frame insertion and shader subframes as never
# enabled by default: both flash the panel and need a photosensitivity review
# first. The session layer does not cover either. 0 dark frames and 1 subframe
# are the off values.
video_black_frame_insertion = "0"
video_shader_subframes = "1"

# The build passes --enable-alsa and the appliance image runs no sound server.
# RetroArch prefers PulseAudio over ALSA whenever configure found PulseAudio
# headers, and it does not retry a failed audio driver: it continues without
# audio.
audio_driver = "alsa"

# Reads /dev/input/event* directly, which the console account reaches through
# the "input" group added by scripts/pi/install-appliance.sh. Supports hotplug
# and rumble; the joydev fallback supports neither.
input_joypad_driver = "udev"

# The appliance installs the retroarch binary alone, without the
# retroarch-assets bundle. ozone, xmb and glui load icons and fonts from it and
# otherwise render a "Missing assets, use the Online Updater" warning over a
# broken menu, and the session layer disables that updater. rgui draws from
# built-in data only.
menu_driver = "rgui"

# No frontend menu combo is set here. vcg-host reads the controller's own event
# device and owns the reserved Select+Start hold itself, above the frontend, so
# the escape survives a core that has stopped processing input. RetroArch's
# Linux default for this key is none, and the generated session layer pins it
# to "0" so a later edit here cannot give the frontend a combo of its own. See
# "Reserved input" in docs/RETROARCH_INTEGRATION.md.

# Announces a started netplay session to the public libretro lobby. RetroArch
# defaults this to true. The game manifest declares network "offline" and the
# host sandbox plan denies the Network capability.
netplay_public_announce = "false"
