[package]
name = "vcg-host"
description = "Native appliance host for VCG Console"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
getrandom = { version = "=0.4.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
tar = { version = "=0.4.46", default-features = false }

[lints]
workspace = true
