<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; frame-src http://localhost:4173; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="vcg-game-origin" content="http://localhost:4173" />
    <title>VCG Godot Bridge Host Fixture</title>
  </head>
  <body>
    <main>
      <h1>VCG GODOT BRIDGE HOST</h1>
      <p id="host-status" role="status">WAITING</p>
      <p>ACCEPTED <output id="accepted-count">0</output></p>
      <p>ACTIVE <output id="active-count">0</output></p>
      <p>PENDING <output id="pending-count">0</output></p>
      <p>INVALID ACK <output id="invalid-ack-count">0</output></p>
      <button id="publish" type="button">PUBLISH FRAME</button>
      <iframe
        id="game"
        title="Sandboxed Godot Motion game"
        sandbox="allow-scripts allow-same-origin"
        src="http://localhost:4173/index.html"
      ></iframe>
    </main>
    <script type="module" src="/src/godot-bridge-host-fixture.ts"></script>
  </body>
</html>
