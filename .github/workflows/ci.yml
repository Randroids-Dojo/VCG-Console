name: CI

# Every job below exists because something it checks reached `main` unnoticed.
# The repository had no continuous integration until 2026-08-02; the first
# Linux run of the existing suite found four defects, all merged directly to
# `main`. See docs/IMPLEMENTATION_LOG.md for that record.
#
# Linux is the product target (Raspberry Pi 5 and ordinary x86-64 Linux).
# Windows is the development host. Both are exercised because defects have been
# found that are invisible on the other: a clippy lint that only fires where
# `PathBuf` is 32 bytes, and a launcher layout collision that only appears
# under Linux font metrics.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  node:
    name: node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `packageManager` in package.json pins the exact pnpm version.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepare:assets fetches the pinned pose model and typeface by exact
      # SHA-256, so a substituted upstream artifact fails here.
      - name: Prepare pinned assets and generated sources
        run: |
          pnpm prepare:assets
          pnpm prepare:catalog
          pnpm prepare:schemas

      # The generators are expected to be deterministic. A dirty tree here
      # means generated output was committed stale, or differs by platform.
      - name: Generated output is deterministic and committed
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated output differs from what is committed. Run the prepare scripts and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # Includes validate:source-bindings, which catches a pre-registration
      # plan whose bound documents changed after it was reviewed. Fourteen
      # such bindings had drifted undetected before this check existed.
      #
      # The containment probes that launch real Chrome run on Linux only: on a
      # cold Windows runner the first launch exceeded the supervisor's 10s
      # DevTools bound and failed two of four runs. Everything else in this
      # suite is pure computation and runs identically on both platforms.
      - name: Test
        env:
          VCG_SKIP_REAL_BROWSER_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate game manifests
        run: pnpm validate:manifests

  native:
    name: native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Runs on both platforms deliberately. `clippy::large_enum_variant` on
      # InstalledRuntime fires only on Windows, where PathBuf is 32 bytes
      # against 24 on Linux, which pushes the variant gap past the 200-byte
      # threshold. A Linux-only lint job would not have seen it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Guards the `default-run` manifest key. Without it, adding a second
      # binary to the crate makes every documented `cargo run -p vcg-host`
      # invocation ambiguous, which silently broke the Raspberry Pi day-one
      # bring-up script and eleven documented commands.
      - name: Host doctor responds
        run: cargo run -q -p vcg-host -- doctor

  # Linux only, on purpose. Linux is the product target: the Raspberry Pi 5 and
  # ordinary x86-64 Linux. This suite drives a real browser and measures live
  # layout geometry, so it depends on real OS resources and is only as stable as
  # the runner it lands on.
  #
  # Windows runs of it produced five spurious failures across this suite and the
  # other real-resource tests -- a different test each time, every one passing on
  # rerun -- and never once caught a defect that Linux did not. The one real
  # layout defect found here, a 720p text collision, reproduced only under Linux
  # font metrics and was caught by the Linux job. A required check that fails
  # spuriously trains people to ignore it, which is worse than not having it.
  #
  # Windows keeps the deterministic checks: fmt, clippy, build, typecheck, and
  # the computational test suite. That is where it earns its place -- the
  # `large_enum_variant` divergence on InstalledRuntime is invisible on Linux.
  e2e:
    name: e2e / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned assets and generated sources
        run: |
          pnpm prepare:assets
          pnpm prepare:catalog
          pnpm prepare:schemas

      # playwright.config.ts pins `channel: "chrome"`, so the suite needs real
      # Google Chrome rather than the bundled Chromium.
      - name: Install Chrome for Playwright
        run: pnpm --filter @vcg/console-lab exec playwright install --with-deps chrome

      # The TV conformance suite measures real layout geometry. A 720p launcher
      # text collision reached main because it only reproduced under Linux font
      # metrics, which wrap a subtitle the Windows metrics fit on one line.
      - name: End-to-end
        run: pnpm test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  native-aarch64:
    name: native / aarch64 cross
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      # The Raspberry Pi 5 is aarch64 and nothing had ever compiled this crate
      # for it: every other job builds x86-64, and scripts/pi/bootstrap.sh warns
      # that a non-aarch64 host is not Raspberry Pi evidence. A target that only
      # fails when the hardware is on the desk is a target nobody checked.
      - name: Add the aarch64 target and cross linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      # --all-targets compiles the test code for aarch64 too, so a target-only
      # compile error in a test is caught without running anything.
      - name: Clippy for aarch64
        run: cargo clippy --workspace --all-targets --target aarch64-unknown-linux-gnu -- -D warnings

      # Linking is the part `cargo check` cannot prove, and a missing or
      # incompatible target library shows up only here.
      - name: Link for aarch64
        run: cargo build --target aarch64-unknown-linux-gnu -p vcg-host

      - name: Artifact really is aarch64
        run: |
          file target/aarch64-unknown-linux-gnu/debug/vcg-host
          file target/aarch64-unknown-linux-gnu/debug/vcg-host | grep -q 'ARM aarch64'

      # Deliberately no `cargo test` here. Under qemu-user the suite fails 17 of
      # 393 tests, all of them in child-process supervision and journal file
      # locking, which the emulator does not reproduce faithfully -- a test that
      # re-executes itself cannot exec an aarch64 child on an x86-64 kernel.
      # Emulated results would be noise, not evidence. The suite runs natively
      # on the Pi during bring-up; see docs/PI_DAY_ONE_BRINGUP.md.

  pi-bringup:
    name: pi bring-up script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - uses: Swatinem/rust-cache@v2

      # Runs the operator-facing script itself rather than reimplementing its
      # steps, so the script cannot rot while its individual commands pass. It
      # installs dependencies, prepares assets, builds, builds and runs the
      # native host, then proves the real preview server serves the browser
      # boundary the camera path depends on.
      #
      # The script warns that a non-aarch64 host is not Raspberry Pi evidence.
      # That warning is correct: this job proves the script runs, not that the
      # Pi is qualified.
      - name: scripts/pi/bootstrap.sh
        run: scripts/pi/bootstrap.sh
